# Intégration continue.
#
# Deux vérifications à chaque poussée :
# * les tests, qui ne téléchargent aucune donnée : ils portent sur la logique de
#   rapprochement et sur les contrôles qualité, avec des tables fabriquées à la
#   main ;
# * le test du correcteur : sur un clone neuf, installer requirements.txt puis
#   exécuter le notebook de bout en bout (Run All). Le notebook récupère seul
#   l'instantané des données du rapport, publié en release ; la CI ne dépend
#   donc pas des 700 Mo d'open data, dont les URL peuvent changer.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier que les modules s'importent
        run: python -c "import lobbynomics; print(lobbynomics.__version__)"
        env:
          PYTHONPATH: src

      - name: Lancer les tests
        run: python -m pytest -q

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run All sur un clone neuf
        run: |
          jupyter nbconvert --to notebook --execute notebooks/rapport.ipynb \
            --output rapport_execute.ipynb --ExecutePreprocessor.timeout=900
