# Intégration continue.
#
# Les tests ne téléchargent aucune donnée : ils portent sur la logique de
# rapprochement et sur les contrôles qualité, avec des tables fabriquées à la
# main. C'est délibéré — une CI qui dépend de 700 Mo d'open data tombe en panne
# le jour où une source change d'URL, pour une raison qui n'a rien à voir avec
# le code.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier que les modules s'importent
        run: python -c "import lobbynomics; print(lobbynomics.__version__)"
        env:
          PYTHONPATH: src

      - name: Lancer les tests
        run: python -m pytest -q
