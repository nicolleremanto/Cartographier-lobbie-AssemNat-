[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobbynomics"
version = "1.0.0"
description = "Cartographie de l'influence déclarée des lobbies sur le travail législatif à l'Assemblée nationale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2", "numpy>=1.26", "pyarrow>=15.0", "requests>=2.31",
    "lxml>=5.0", "rapidfuzz>=3.9", "scikit-learn>=1.4", "statsmodels>=0.14",
    "matplotlib>=3.8", "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
